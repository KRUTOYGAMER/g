name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build TG Anime Glass (unsigned)
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build for physical iOS devices without code signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project TGAnimeGlass.xcodeproj \
            -target TGAnimeGlass \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/TGAnimeGlassDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee "$RUNNER_TEMP/TGAnimeGlass-xcodebuild.log"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/TGAnimeGlassDerivedData/Build/Products/Release-iphoneos/TGAnimeGlass.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/TGAnimeGlass"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          echo "Built app bundle: $BUNDLE_ID"

          PACKAGE_DIR="$RUNNER_TEMP/ipa-package"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Payload"
          ditto "$APP_PATH" "$PACKAGE_DIR/Payload/TGAnimeGlass.app"

          rm -f "$GITHUB_WORKSPACE/TGAnimeGlass-unsigned.ipa"
          cd "$PACKAGE_DIR"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/TGAnimeGlass-unsigned.ipa" Payload

          /usr/bin/unzip -l "$GITHUB_WORKSPACE/TGAnimeGlass-unsigned.ipa"
          test -s "$GITHUB_WORKSPACE/TGAnimeGlass-unsigned.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGAnimeGlass-unsigned-IPA
          path: TGAnimeGlass-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
